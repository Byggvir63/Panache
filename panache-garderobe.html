<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garde-robe — Panache</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14120F;
    --panel: #1C1A16;
    --panel-raised: #262319;
    --ink: #EDE6D8;
    --ink-soft: #D2C6AE;
    --gold: #C4A15C;
    --gold-bright: #E3C687;
    --muted: #877C67;
    --rule: rgba(196,161,92,0.28);
    --dim: #55503F;
    --sage: #7E9C6E;
    --amber: #C77D3E;
    --radius: 10px;
    --shadow: 0 14px 34px rgba(0,0,0,0.5);
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Work Sans', sans-serif;
  }
 
  *{ box-sizing: border-box; }
 
  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
 
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: clamp(2.5rem, 6vw, 5rem) clamp(1.25rem, 4vw, 2rem);
  }
 
  a{ color: inherit; }
 
  .page{ width: 100%; max-width: 1120px; }
 
  header.masthead{
    text-align:center;
    margin-bottom: clamp(2rem, 5vw, 3rem);
  }
 
  .kicker{
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 0.6rem;
  }
  .kicker a{
    text-decoration: none;
    border-bottom: 1px solid rgba(135,124,103,0.4);
  }
  .kicker a:hover{ color: var(--gold-bright); border-bottom-color: var(--gold-bright); }
 
  h1{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.2rem, 5.2vw, 3.1rem);
    margin: 0 0 0.9rem;
    color: var(--ink);
  }
 
  .lede{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.08rem;
    color: var(--ink-soft);
    max-width: 52ch;
    margin: 0 auto;
    line-height: 1.55;
  }
 
  .stat-row{
    display:flex;
    justify-content:center;
    gap: 1.6rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }
  .stat-row .stat{ font-size: 0.85rem; color: var(--muted); }
  .stat-row .stat b{ color: var(--gold-bright); font-weight: 600; }
 
  .filters{
    display:flex;
    justify-content:center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.6rem;
  }
  .filters button{
    font-family: var(--font-body);
    font-size: 0.78rem;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 5px 12px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .filters button:hover{ color: var(--gold-bright); border-color: var(--gold); }
  .filters button.active{ color: var(--bg); background: var(--gold-bright); border-color: var(--gold-bright); }
 
  .group{ margin-top: 2.6rem; }
  .group-head{
    display:flex;
    align-items: baseline;
    gap: 0.7rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.6rem;
    margin-bottom: 1.2rem;
  }
  .group-head h2{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
    color: var(--gold-bright);
  }
  .group-head .count{ font-size: 0.78rem; color: var(--dim); }
 
  .gallery{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 1rem;
  }
 
  .card{
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: rgba(227,198,135,0.55);
  }
  .card.wished{ opacity: 0.72; }
 
  .card-cover{
    width: 100%;
    aspect-ratio: 4 / 3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 2.4rem;
    color: var(--dim);
    background:
      repeating-linear-gradient(135deg, var(--panel-raised), var(--panel-raised) 10px, var(--panel) 10px, var(--panel) 20px);
  }
  img.card-cover{ object-fit: cover; filter: sepia(6%) saturate(105%); }
 
  .card-badge{
    position: absolute;
    top: 9px;
    right: 9px;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 7px;
    border: 1px solid;
    background: rgba(20,18,15,0.85);
  }
  .badge-ok{ color: var(--sage); border-color: var(--sage); }
  .badge-warn{ color: var(--amber); border-color: var(--amber); }
  .badge-wish{ color: var(--gold-bright); border-color: var(--gold); }
  .badge-none{ color: var(--muted); border-color: var(--dim); }
 
  .card-qty{
    position: absolute;
    top: 9px;
    left: 9px;
    font-size: 0.65rem;
    padding: 2px 6px;
    background: rgba(20,18,15,0.85);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
  }
 
  .card-body{ padding: 0.75rem 0.9rem 0.9rem; }
 
  .card-tag{
    font-size: 0.63rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--sage);
    margin: 0 0 0.2rem;
  }
 
  .card-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0 0 0.2rem;
    color: var(--ink);
    line-height: 1.25;
  }
 
  .card-sub{
    font-size: 0.75rem;
    font-style: italic;
    color: var(--muted);
    margin: 0;
  }
 
  /* --- Modal --- */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    z-index: 999;
  }
  .overlay.open{ display: flex; }
 
  .modal{
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
 
  .modal-close{
    position: absolute;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    color: var(--ink);
    border: none;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
    z-index: 2;
  }
  .modal-close:hover{ background: var(--gold-bright); color: var(--bg); }
 
  .modal-cover{
    height: 200px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 3.4rem;
    color: var(--dim);
    background:
      repeating-linear-gradient(135deg, var(--panel-raised), var(--panel-raised) 12px, var(--panel) 12px, var(--panel) 24px);
  }
  img.modal-cover{ width:100%; height:280px; object-fit:cover; filter: sepia(6%) saturate(105%); }
 
  .modal-body{ padding: 1.6rem 1.8rem 2rem; }
 
  .modal-breadcrumb{
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--sage);
    margin: 0 0 0.5rem;
  }
 
  .modal-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.6rem;
    margin: 0 0 0.5rem;
    color: var(--ink);
  }
 
  .modal-badge{
    display:inline-block;
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 9px;
    border: 1px solid;
    margin: 0 0 0.9rem;
  }
 
  .modal-specs{
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.35rem 1rem;
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin: 0 0 1.1rem;
  }
  .modal-specs dt{ color: var(--muted); }
  .modal-specs dd{ margin: 0; }
 
  .modal-price{
    font-size: 1.2rem;
    color: var(--gold-bright);
    margin: 0 0 1rem;
  }
 
  .modal-comment{
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--ink-soft);
    font-style: italic;
    margin: 0;
    padding-top: 0.9rem;
    border-top: 1px dashed var(--rule);
    white-space: pre-line;
  }
 
  .modal-link{
    display: inline-block;
    margin-top: 0.9rem;
    font-size: 0.85rem;
    color: var(--gold-bright);
    border-bottom: 1px solid transparent;
  }
  .modal-link:hover{ border-color: var(--gold-bright); }
 
  footer.colophon{
    margin-top: 3rem;
    text-align:center;
    font-size: 0.78rem;
    color: var(--dim);
  }
</style>
</head>

</div>

  const GROUP_ORDER = ["Haut", "Bas", "Veste & Manteau", "Chaussures", "Sous-vêtement", "Accessoire", "Cosmétique"];
 
  const root = document.getElementById('gallery-root');
  const overlay = document.getElementById('overlay');
  const modalContent = document.getElementById('modal-content');
 
  function initial(str){ return str.trim().charAt(0).toUpperCase(); }
  function isImageUrl(url){ return /\.(jpe?g|png|webp|gif)(\?|$)/i.test(url); }
  function formatPrice(n){ return n.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €'; }
 
  function statusClass(statut){
    if (statut === 'Souhaité') return 'badge-wish';
    if (statut === 'Neuf' || statut === 'Très bon' || statut === 'Bon') return 'badge-ok';
    if (statut === 'Correct') return 'badge-none';
    if (statut === 'Usé' || statut === 'À réparer' || statut === "Hors d'usage") return 'badge-warn';
    return 'badge-none';
  }
 
  function renderStats(){
    const owned = ITEMS.filter(i => i.statut !== 'Souhaité');
    const wished = ITEMS.filter(i => i.statut === 'Souhaité');
    const ownedCount = owned.reduce((s,i) => s + i.quantite, 0);
    const wishedCount = wished.reduce((s,i) => s + i.quantite, 0);
    const knownValue = owned.filter(i => i.prix != null).reduce((s,i) => s + i.prix * i.quantite, 0);
    document.getElementById('stat-total').textContent = ownedCount;
    document.getElementById('stat-wish').textContent = wishedCount;
    document.getElementById('stat-value').textContent = formatPrice(knownValue);
  }
 
  function renderGallery(){
    GROUP_ORDER.forEach(cat => {
      const items = ITEMS.filter(i => i.categorie === cat);
      if (!items.length) return;
 
      const group = document.createElement('section');
      group.className = 'group';
      group.dataset.cat = cat;
 
      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = '<h2>' + cat + '</h2><span class="count">' + items.length + '</span>';
      group.appendChild(head);
 
      const grid = document.createElement('div');
      grid.className = 'gallery';
 
      items.forEach(it => {
        const card = document.createElement('article');
        card.className = 'card' + (it.statut === 'Souhaité' ? ' wished' : '');
        card.addEventListener('click', () => openModal(it.id));
 
        const badge = document.createElement('span');
        badge.className = 'card-badge ' + statusClass(it.statut);
        badge.textContent = it.statut;
        card.appendChild(badge);
 
        if (it.quantite > 1) {
          const qty = document.createElement('span');
          qty.className = 'card-qty';
          qty.textContent = '×' + it.quantite;
          card.appendChild(qty);
        }
 
        if (it.image && isImageUrl(it.image)) {
          const img = document.createElement('img');
          img.className = 'card-cover';
          img.src = it.image;
          img.alt = it.piece;
          img.onerror = function(){ this.replaceWith(Object.assign(document.createElement('div'), {className: 'card-cover', textContent: initial(it.piece)})); };
          card.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'card-cover';
          ph.textContent = initial(it.piece);
          card.appendChild(ph);
        }
 
        const body = document.createElement('div');
        body.className = 'card-body';
        body.innerHTML =
          '<p class="card-tag">' + it.sousCategorie + '</p>' +
          '<h3 class="card-title">' + it.piece + '</h3>' +
          '<p class="card-sub">' + (it.marque || '—') + (it.couleur ? ' · ' + it.couleur : '') + '</p>';
        card.appendChild(body);
 
        grid.appendChild(card);
      });
 
      group.appendChild(grid);
      root.appendChild(group);
    });
  }
 
  function openModal(id){
    const it = ITEMS.find(x => x.id === id);
    if (!it) return;
 
    let html = (it.image && isImageUrl(it.image))
      ? '<img class="modal-cover" src="' + it.image + '" alt="' + it.piece + '" onerror="this.outerHTML=\'<div class=&quot;modal-cover&quot;>' + initial(it.piece) + '</div>\'">'
      : '<div class="modal-cover">' + initial(it.piece) + '</div>';
    html += '<div class="modal-body">';
    html += '<p class="modal-breadcrumb">' + it.categorie + ' — ' + it.sousCategorie + '</p>';
    html += '<h2 class="modal-title">' + it.piece + (it.quantite > 1 ? ' <span style="color:var(--muted); font-style:italic; font-size:1rem;">(×' + it.quantite + ')</span>' : '') + '</h2>';
    html += '<span class="modal-badge ' + statusClass(it.statut) + '">' + it.statut + '</span>';
    html += '<dl class="modal-specs">';
    html += '<dt>Marque</dt><dd>' + (it.marque || '—') + '</dd>';
    if (it.couleur) html += '<dt>Couleur</dt><dd>' + it.couleur + '</dd>';
    if (it.taille) html += '<dt>Taille</dt><dd>' + it.taille + '</dd>';
    if (it.date) html += '<dt>Acquis</dt><dd>' + it.date + '</dd>';
    html += '</dl>';
    if (it.prix != null) html += '<p class="modal-price">' + formatPrice(it.prix) + '</p>';
    if (it.commentaire) html += '<p class="modal-comment">' + it.commentaire + '</p>';
    if (it.image && !isImageUrl(it.image)) {
      html += '<a class="modal-link" href="' + it.image + '" target="_blank" rel="noopener">Voir la fiche produit ↗</a>';
    }
    html += '</div>';
 
    modalContent.innerHTML = html;
    overlay.classList.add('open');
  }
 
  function closeModal(){ overlay.classList.remove('open'); }
 
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
 
  renderStats();
  renderGallery();
</script>
